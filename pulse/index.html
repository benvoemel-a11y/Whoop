<style>
:root{
  --bg:#13181c;--bg-top:#2b333a;--card:#272e34;--card2:#343c42;--track:#3b4349;--line:#363e44;
  --fg:#fff;--muted:#a2acb3;--dim:#6e7981;
  --sleep:#7ba1bb;--green:#16ec06;--yellow:#ffde00;--red:#ff2d3d;--strain:#0093e7;
  --mint:#4fe39b;--link:#4aa3df;--deep:#e67cf0;--rem:#9b6cf3;--light:#aeb9c3;--wake:#dfe5ea;
  --s-low:#5aa6e8;--s-mid:#4fe39b;--s-high:#f5a33a;
  --num:"Barlow","DIN Alternate","Arial Narrow",system-ui,sans-serif;
  --ui:"Figtree",system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{color:var(--fg);font-family:var(--ui);font-size:15px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
input,textarea,select{font:inherit;font-size:16px!important;-webkit-user-select:text;user-select:text;color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:none}
select{appearance:none;-webkit-appearance:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit;touch-action:manipulation}
[hidden]{display:none!important}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.bgfx{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,var(--bg-top) 0%,#222a30 40%,var(--bg) 100%)}
.in{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header{flex:0 0 auto;background:var(--bg-top);padding-top:env(safe-area-inset-top)}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:54px}
.avatar{position:relative;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center}
.avatar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.avatar.rg{box-shadow:0 0 0 2px var(--rc,transparent);padding:2px;background-clip:content-box}
.pill{display:flex;align-items:center;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.pill button{width:32px;height:30px;display:grid;place-items:center;color:var(--muted)}
.pill span{min-width:92px;text-align:center;font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.hbtn{justify-self:end;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
main .in{padding-bottom:28px}
nav{flex:0 0 auto;background:#0f1316;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:grid;grid-template-columns:repeat(4,1fr);height:58px}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--dim)}
nav button.on{color:var(--fg)}
nav svg{width:23px;height:23px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 2px 10px;font-weight:700}
.card{background:var(--card);border-radius:16px;padding:16px 14px;margin-top:12px}
.card.tap{cursor:pointer}
.ct{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.ct small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--dim)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px}
.ring .lab{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ring svg{width:100%;display:block}
.rw{position:relative;width:100%;max-width:112px}
.rv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed","DIN Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:34px;letter-spacing:-.01em;line-height:1;font-variant-numeric:tabular-nums;color:#fff}
.rv sup{font-size:.48em;font-weight:600;margin-left:1px;align-self:flex-start;margin-top:36%;vertical-align:baseline}
.rv.na{color:var(--dim)}
.big{font-family:var(--num);font-size:38px;font-weight:700;line-height:1}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row b{font-family:var(--num);font-size:18px}
.mut{color:var(--muted)}.dim{color:var(--dim)}.sm{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--card);border-radius:14px;padding:13px;cursor:pointer;min-height:86px}
.tile .t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.tile .v{font-family:var(--num);font-size:28px;font-weight:700;margin-top:8px}
.tile .v small{font-size:14px;color:var(--muted);margin-left:2px}
.tile .d{font-size:12px;color:var(--dim);margin-top:2px}
.est{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-left:4px;vertical-align:middle;letter-spacing:0;text-transform:none;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--fg);color:#111;font-weight:700;border-radius:12px;padding:13px;width:100%;margin-top:10px}
.btn.sec{background:var(--card2);color:var(--fg)}
.btn.red{background:var(--red);color:#fff}
.btn.sm2{padding:9px 12px;width:auto;font-size:14px;margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;background:var(--card);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--fg);color:#111}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-radius:10px;padding:3px;margin-top:8px}
.seg button{padding:8px;border-radius:8px;text-align:center;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.list .it:first-child{border-top:0}
.list .it .ic{width:38px;height:38px;border-radius:11px;background:var(--card2);display:grid;place-items:center;flex:0 0 auto}
.list .it .tx{flex:1;min-width:0}
.list .it .tx div:first-child{font-weight:600}
.list .it .tx div+div{font-size:13px;color:var(--muted);margin-top:2px}
.list .it .rt{font-family:var(--num);font-size:18px;font-weight:700}
/* Sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg);transform:translateY(100%);transition:transform .28s ease}
.sheet.open{transform:none}
.sheet .sh{flex:0 0 auto;background:var(--bg-top);padding-top:env(safe-area-inset-top)}
.sheet .sh .in{display:flex;align-items:center;justify-content:space-between;height:54px}
.sheet .sh b{font-size:16px}
.sheet .sb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .sb .in{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.x{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center}
label.f{display:block;margin-top:12px;font-size:13px;color:var(--muted);font-weight:600}
label.f>input,label.f>select,label.f>textarea{margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.q{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.yn{display:flex;gap:6px;flex:0 0 auto}
.yn button{padding:7px 13px;border-radius:9px;background:var(--card2);font-weight:600;font-size:14px;color:var(--muted)}
.yn button.y{background:var(--mint);color:#062}
.yn button.n{background:#58616a;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;font-weight:600;padding:11px 16px;border-radius:12px;z-index:50;max-width:90%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.msg{padding:11px 13px;border-radius:14px;margin-top:10px;line-height:1.45;max-width:88%;-webkit-user-select:text;user-select:text}
.msg.u{background:var(--card2);margin-left:auto}
.msg.a{background:var(--card)}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}.msg ul{margin:4px 0;padding-left:18px}
.chat-in{display:flex;gap:8px;margin-top:14px}
.chat-in textarea{flex:1;min-height:46px;max-height:120px}
.send{width:46px;flex:0 0 46px;border-radius:12px;background:var(--fg);color:#111;display:grid;place-items:center}
.set{display:grid;grid-template-columns:1fr 70px 70px 32px;gap:6px;align-items:center;margin-top:6px}
.set input{padding:8px}
.ex{background:var(--card2);border-radius:12px;padding:10px;margin-top:10px}
.ex input,.ex select{background:var(--card)}
.rm{color:var(--dim);display:grid;place-items:center;height:36px}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.det{cursor:pointer}
details.card summary{list-style:none;font-weight:700;display:flex;justify-content:space-between;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:8px}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin-top:8px}
.hint ol{padding-left:18px;margin:6px 0}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.25}}
</style>

<div class="bgfx"></div>
<header><div class="in top">
  <button class="avatar" id="av" data-act="tab" data-tab="mehr" aria-label="Profil"></button>
  <div class="pill" id="datepill"><button data-act="day" data-n="-1"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><span id="dlab">Heute</span><button data-act="day" data-n="1"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
  <button class="hbtn" data-act="import" aria-label="Importieren"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
</div></header>

<div class="sheet" id="sheet"><div class="sh"><div class="in"><b id="shT"></b><button class="x" data-act="close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div><div class="sb" id="shB"><div class="in" id="shC"></div></div></div>
<input type="file" id="file" multiple hidden><input type="file" id="pfile" accept="image/*" hidden>
<script>
'use strict';
/* ================= Grundlagen ================= */
const KEY='pulse.v1',$=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=fromIso(s);d.setDate(d.getDate()+n);return iso(d)};
const TODAY=()=>iso(new Date());
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=m=>m==null?'–':`${Math.floor(m/60)}:${pad(Math.round(m%60))}`;
const r1=v=>v==null?null:Math.round(v*10)/10;
const fmtN=(v,d=0)=>v==null||isNaN(v)?'–':Number(v).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const dLong=s=>fromIso(s).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
const n=v=>{if(v===''||v==null)return null;const x=Number(String(v).replace(',','.'));return isFinite(x)?x:null};
const ts=v=>{const x=Number(v);if(v!==''&&v!=null&&isFinite(x))return x>1e12?x:x*1000;const d=Date.parse(v);return isNaN(d)?null:d};
const sv=p=>`<svg class="i" viewBox="0 0 24 24">${p}</svg>`;
const IC={
  home:sv('<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>'),
  trend:sv('<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>'),
  train:sv('<path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/>'),
  coach:sv('<path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/>'),
  more:sv('<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>'),
  run:sv('<circle cx="14" cy="4.5" r="1.8"/><path d="M8 21l3-6 3 2v4M7 12l3-4h4l2 3 3 1M10 8l-1 4 4 2"/>'),
  lift:sv('<path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/>'),
  bed:sv('<path d="M3 18V8M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.6"/>'),
  hrv:sv('<path d="M2 13h4l2-5 3 10 3-8 2 3h6"/>'),
  heart:sv('<path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"/>'),
  shoe:sv('<path d="M3 17h17a1 1 0 0 0 1-1c0-1.5-2-2.5-5-3l-3-4H9L7 7H4l-1 10zM3 20h18"/>'),
  scale:sv('<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8.5 9.5a5 5 0 0 1 7 0L13 12"/>'),
  age:sv('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  stress:sv('<path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7v5l4 2"/>'),
  book:sv('<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>'),
  plus:sv('<path d="M12 5v14M5 12h14"/>'),
  send:sv('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  trash:sv('<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/>'),
  chev:sv('<path d="M9 6l6 6-6 6"/>'),
  spark:sv('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>')
};

/* ================= Speicher ================= */
const DEF=()=>({v:1,days:{},hyp:{},curve:{},wo:[],routines:[],journal:{},qHide:[],qCustom:[],
  profile:{name:'',age:null,sex:'m',height:null,need:8,maxHr:null},ai:{prov:'gemini',key:'',model:''},chat:[],fitExt:null,src:{},setup:false});
let S=DEF();
try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);S=Object.assign(DEF(),o);S.profile=Object.assign(DEF().profile,o.profile);S.ai=Object.assign(DEF().ai,o.ai)}}catch(e){}
// Speicher: IndexedDB (groß, dauerhaft) + localStorage als schnelle Kopie, solange es passt
let idbP=null;const idb=()=>idbP||(idbP=new Promise((ok,bad)=>{const r=indexedDB.open('pulse-state',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)}));
const idbGet=async k=>{const d=await idb();return new Promise(ok=>{const r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})};
const idbPut=async(k,v)=>{const d=await idb();return new Promise((ok,bad)=>{const tx=d.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=ok;tx.onerror=()=>bad(tx.error)})};
let svT=null;
const savePlain=()=>{clearTimeout(svT);svT=setTimeout(()=>{const js=JSON.stringify(S);idbPut('S',js).catch(()=>toast('Speichern fehlgeschlagen'));
  try{if(js.length<2.5e6)localStorage.setItem(KEY,js);else localStorage.setItem(KEY,JSON.stringify(Object.assign({},S,{hyp:{},curve:{},lsPartial:1})))}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}},150)};
window.addEventListener('pagehide',()=>{if(svT){clearTimeout(svT);try{idbPut('S',JSON.stringify(S))}catch(e){}}});
const save=()=>{S.mod=Date.now();savePlain();if(typeof syncSoon==='function'){syncSoon();pushSoon()}};
const D=d=>S.days[d]||{};
function setDay(d,o){const x=S.days[d]=S.days[d]||{};for(const k in o){if(o[k]!=null&&!(typeof o[k]==='number'&&isNaN(o[k])))x[k]=o[k]}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ================= Berechnungen ================= */
function base(d,f,len=30){let s=0,c=0;for(let i=1;i<=len;i++){const v=D(addD(d,-i))[f];if(v!=null){s+=v;c++}}return c>=3?s/c:null}
const maxHr=()=>S.profile.maxHr||(S.profile.age?Math.round(208-0.7*S.profile.age):195);
const rhrAt=d=>D(d).rhr??base(d,'rhr',14)??60;
const stepsOf=d=>{const x=D(d);const v=[x.steps,x.bandSteps].filter(v=>v!=null);return v.length?Math.max(...v):null};
const K=86,toStrain=t=>21*(1-Math.exp(-t/K)),toTrimp=s=>-K*Math.log(1-Math.min(s,20.9)/21);
function trimpWo(w){
  if(w.avg){const r=rhrAt(w.date),m=Math.max(maxHr(),w.max||0),x=clamp((w.avg-r)/(m-r),0,1);return(w.dur||0)*x*0.64*Math.exp(1.92*x)}
  const rpe=w.rpe||(w.kind==='kraft'?7:5);return(w.dur||0)*rpe*(w.kind==='kraft'?0.18:0.2)}
const woOn=d=>S.wo.filter(w=>w.date===d);
function strainOf(d){const x=D(d),ws=woOn(d),st=stepsOf(d);
  if(x.strain!=null){let t=toTrimp(x.strain);const band=x.src==='band'&&(x.worn||0)>600;
    ws.filter(w=>w.src==='manual'&&!(band&&w.kind!=='kraft')).forEach(w=>t+=trimpWo(w)*(band?0.5:1));return{v:r1(toStrain(t)),est:ws.some(w=>w.src==='manual')}}
  if(!ws.length&&st==null)return{v:null};
  let t=(st||0)/1000*1.5;ws.forEach(w=>t+=trimpWo(w));return{v:r1(toStrain(t)),est:true}}
const needBase=()=>(S.profile.need||8)*60;
function needOf(d){const b=needBase(),ps=strainOf(addD(d,-1)).v;let m=b+(ps!=null?Math.max(0,ps-8)*4:0),debt=0;
  for(let i=1;i<=3;i++){const s=D(addD(d,-i)).sleep;if(s!=null)debt+=Math.max(0,b-s)}
  return Math.round(m+Math.min(60,debt*0.3))}
function deficitOf(d){const b=needBase();let a=0,c=0;for(let i=0;i<7;i++){const s=D(addD(d,-i)).sleep;if(s!=null){a+=b-s;c++}}return c?Math.max(0,Math.round(a)):null}
function sleepOf(d){const x=D(d);if(x.sleep==null)return{min:null};
  const need=needOf(d),perf=Math.min(100,Math.round(x.sleep/need*100));
  const eff=x.eff??(x.wake!=null?x.sleep/(x.sleep+x.wake)*100:null);
  let q=null;if(x.deep!=null&&x.rem!=null){const ds=x.deep/x.sleep,rs=x.rem/x.sleep;q=Math.round((eff??90)*0.5+Math.min(100,ds/0.2*100)*0.25+Math.min(100,rs/0.22*100)*0.25)}
  else if(eff!=null)q=Math.round(eff);
  return{min:x.sleep,need,perf,eff:eff==null?null:Math.round(eff),q,debt:deficitOf(d),deep:x.deep,rem:x.rem,light:x.light,wake:x.wake}}
function recOf(d){const x=D(d);if(x.rec!=null)return{v:Math.round(x.rec),est:false};
  const bh=base(d,'hrv'),br=base(d,'rhr'),sp=sleepOf(d);let s=0,w=0;
  if(x.hrv!=null&&bh){s+=0.55*clamp((x.hrv/bh-1)/0.15,-2.5,2.5);w+=.55}
  if(x.rhr!=null&&br){s+=0.25*clamp((br-x.rhr)/br/0.06,-2.5,2.5);w+=.25}
  if(sp.perf!=null){s+=0.2*clamp((sp.perf-85)/15,-2.5,1.5);w+=.2}
  if(!w)return{v:null};s/=w;const ps=strainOf(addD(d,-1)).v;if(ps>14)s-=(ps-14)*0.06;
  return{v:clamp(Math.round(60+24*s),1,99),est:true}}
function stressOf(d){const c=S.curve[d];if(c&&c.length)return{v:r1(c.reduce((a,p)=>a+p[1],0)/c.length),curve:c};const v=D(d).stress;return{v:v==null?null:r1(v)}}
function latest(f,d,len=60){for(let i=0;i<len;i++){const k=addD(d,-i),v=D(k)[f];if(v!=null)return{v,d:k}}return null}
function avgN(f,d,len){let s=0,c=0;for(let i=0;i<len;i++){const v=f(addD(d,-i));if(v!=null){s+=v;c++}}return c?s/c:null}
function fitAgeOf(d){const p=S.profile;
  if(S.fitExt&&S.fitExt.v&&(!p.age))return{v:S.fitExt.v,src:'Garmin'};
  if(!p.age)return{v:null};
  const vo=latest('vo2',d,90),rhr=avgN(k=>D(k).rhr,d,30);let vo2=vo?vo.v:(rhr?15.3*maxHr()/rhr:null);
  if(vo2==null)return{v:null};
  const norm=p.sex==='w'?52-0.38*p.age:60-0.4*p.age;let a=p.age+(norm-vo2)/0.4*0.5;
  const st=avgN(stepsOf,d,30);if(st!=null)a+=clamp((8000-st)/4000,-2,2);
  const sl=avgN(k=>D(k).sleep,d,30);if(sl!=null&&sl<420)a+=(420-sl)/60;
  const f=latest('fat',d,90);if(f){const lim=p.sex==='w'?28:20;if(f.v>lim)a+=(f.v-lim)*0.3}
  a=clamp(a,p.age-15,p.age+20);
  if(S.fitExt&&S.fitExt.v)return{v:r1(S.fitExt.v),src:'Garmin',own:r1(a)};
  return{v:r1(a),est:true,vo2:r1(vo2)}}

  <div class="rv${na?' na':''}">${na?'–':val}${!na&&suf?`<sup>${suf}</sup>`:''}</div></div>`}
function hypno(d){const l=S.hyp[d];if(!l||!l.length)return'';const a=l[0][0],b=l[l.length-1][1],W=320,Hh=70,row={wake:0,rem:1,light:2,deep:3},col={wake:'var(--wake)',rem:'var(--rem)',light:'var(--light)',deep:'var(--deep)'};
  const x=t=>(t-a)/(b-a)*W;let s='';l.forEach(([p,q,st])=>{s+=`<rect x="${x(p).toFixed(1)}" y="${row[st]*17+2}" width="${Math.max(.8,x(q)-x(p)).toFixed(1)}" height="14" rx="2" fill="${col[st]}"/>`});
  const tf=t=>new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  return`<svg viewBox="0 0 ${W} ${Hh+14}" style="width:100%;margin-top:12px">${s}<text x="0" y="${Hh+12}" fill="var(--dim)" font-size="10">${tf(a)}</text><text x="${W}" y="${Hh+12}" text-anchor="end" fill="var(--dim)" font-size="10">${tf(b)}</text></svg>`}
function stressChart(c){const b={};c.forEach(([t,v])=>{const d=new Date(t),k=d.getHours()*4+Math.floor(d.getMinutes()/15);(b[k]=b[k]||[]).push(v)});
  const W=320,H=70,bw=W/96;let s='';for(let k=0;k<96;k++){if(!b[k])continue;const v=b[k].reduce((a,x)=>a+x,0)/b[k].length,h=Math.max(2,v/3*H);s+=`<rect x="${(k*bw).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(bw-.6).toFixed(1)}" height="${h.toFixed(1)}" fill="${stCol(v)}" rx="1"/>`}
  const lab=[0,6,12,18,24].map(h=>`<text x="${h/24*W}" y="${H+13}" text-anchor="${h==0?'start':h==24?'end':'middle'}" fill="var(--dim)" font-size="10">${pad(h%24)}</text>`).join('');
  return`<svg viewBox="0 0 ${W} ${H+16}" style="width:100%;margin-top:6px"><line x1="0" x2="${W}" y1="${H/3}" y2="${H/3}" stroke="var(--line)" stroke-dasharray="3 3"/><line x1="0" x2="${W}" y1="${H*2/3}" y2="${H*2/3}" stroke="var(--line)" stroke-dasharray="3 3"/>${s}${lab}</svg>`}
function chart(pts,o={}){const W=330,H=150,P=24;const vs=pts.filter(p=>p.v!=null);if(vs.length<1)return'<div class="empty">Noch keine Daten in diesem Zeitraum</div>';
  let lo=Math.min(...vs.map(p=>p.v)),hi=Math.max(...vs.map(p=>p.v));if(o.min!=null)lo=Math.min(lo,o.min);if(o.max!=null)hi=Math.max(hi,o.max);if(hi===lo){hi+=1;lo-=1}
  const pd=(hi-lo)*.12;if(o.min==null)lo-=pd;hi+=pd;const N=pts.length,x=i=>P+(N<2?0:i/(N-1)*(W-P-6)),y=v=>H-18-(v-lo)/(hi-lo)*(H-30);
  let g='';[lo+(hi-lo)*.2,lo+(hi-lo)*.5,lo+(hi-lo)*.8].forEach(v=>{g+=`<line x1="${P}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P-4}" y="${y(v)+3}" text-anchor="end" fill="var(--dim)" font-size="9">${fmtN(v,o.dec||0)}</text>`});
  let body='';
  if(o.bar){const bw=Math.max(2,(W-P-6)/N*.62);pts.forEach((p,i)=>{if(p.v==null)return;const yy=y(p.v),y0=y(Math.max(lo,o.min??lo));body+=`<rect x="${x(i)-bw/2}" y="${yy}" width="${bw}" height="${Math.max(1,y0-yy)}" rx="2" fill="${o.col?o.col(p.v):'var(--strain)'}"/>`})}
  else{let path='',on=false;pts.forEach((p,i)=>{if(p.v==null){on=false;return}path+=(on?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1);on=true});
    body=`<path d="${path}" fill="none" stroke="${o.stroke||'var(--link)'}" stroke-width="2.2" stroke-linejoin="round"/>`+(N<=31?pts.map((p,i)=>p.v==null?'':`<circle cx="${x(i)}" cy="${y(p.v)}" r="2.6" fill="${o.col?o.col(p.v):o.stroke||'var(--link)'}"/>`).join(''):'')}
  const ls=[0,Math.floor((N-1)/2),N-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${x(i)}" y="${H-3}" text-anchor="${i==0?'start':i==N-1?'end':'middle'}" fill="var(--dim)" font-size="9">${fromIso(pts[i].d).toLocaleDateString('de-DE',{day:'numeric',month:'numeric'})}</text>`).join('');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%">${g}${body}${ls}</svg>`}

   <div class="row"><span class="mut">Ruhe-HF</span><span><b>${fmtN(x.rhr)}</b> <span class="sm mut">bpm ${br&&x.rhr?`(${x.rhr>=br?'+':''}${Math.round(x.rhr-br)})`:''}</span></span></div></div>`,
   strain:()=>{const ws=woOn(day);return`<div class="card"><div class="ct">Belastung ${e(st.est)}<small>${stp!=null?fmtN(stp)+' Schritte':''}</small></div>

   stress:()=>`<div class="card tap" data-act="met" data-k="stress"><div class="ct">Stress im Tagesverlauf <small>${ss.v!=null?'Ø '+fmtN(ss.v,1)+' / 3':''}</small></div>
   ${ss.curve?stressChart(ss.curve)+`<div class="legend"><span><i style="background:var(--s-low)"></i>niedrig</span><span><i style="background:var(--s-mid)"></i>mittel</span><span><i style="background:var(--s-high)"></i>hoch</span></div>`:`<div class="sm mut">${ss.v!=null?'Nur Tageswert vorhanden.':'Keine Stressdaten – kommen vom Band, aus Garmin oder dem Puls-Verlauf.'}</div>`}</div>`,
   journal:()=>{const y=addD(day,-1),jd=S.journal[y],cnt=jd?Object.keys(jd.a||{}).length:0;return`<div class="card tap" data-act="journal" data-d="${y}"><div style="display:flex;align-items:center;gap:12px"><div style="width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center">${IC.book}</div>
   <div style="flex:1"><div style="font-weight:700">Logbuch für ${y===addD(TODAY(),-1)?'gestern':dLong(y)}</div><div class="sm mut">${jd?cnt+' Antworten – tippen zum Ändern':'Noch nicht ausgefüllt'}</div></div>${IC.chev}</div></div>`},
  };
  Object.assign(B,EXTRA_B);
  let h='',tiles=[];const flush=()=>{if(tiles.length){h+=`<div class="grid2">${tiles.join('')}</div>`;tiles=[]}};
  layout().forEach(b=>{if(!b.on)return;if(b.id.startsWith('t_'))tiles.push(tileOf(b.id.slice(2)));else{flush();h+=B[b.id]()}});flush();
  h+=`<button class="btn sec" style="margin-top:18px" data-act="sheet" data-s="layout">Startseite anpassen</button>`;
  return h}
function woItem(w){const s=r1(toStrain(trimpWo(w)));const vol=w.kind==='kraft'?(w.ex||[]).reduce((a,e)=>a+(e.sets||[]).reduce((b,s)=>b+(s.kg||0)*(s.reps||0),0),0):0;
  return`<div class="it" data-act="wo" data-id="${w.id}"><div class="ic">${w.kind==='kraft'?IC.lift:IC.run}</div><div class="tx"><div>${esc(w.name||w.type||(w.kind==='kraft'?'Krafttraining':'Ausdauer'))}</div>

function vTrends(){const vis=trendKeys().filter(b=>b.on).map(b=>b.id);if(!vis.includes(trendK))trendK=vis[0];
  const m=MET[trendK],pts=[];for(let i=trendR-1;i>=0;i--){const d=addD(TODAY(),-i);pts.push({d,v:m.get(d)})}
  const vs=pts.filter(p=>p.v!=null).map(p=>p.v),avg=vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null;
  const prev=[];for(let i=2*trendR-1;i>=trendR;i--){const v=m.get(addD(TODAY(),-i));if(v!=null)prev.push(v)}const pa=prev.length?prev.reduce((a,b)=>a+b,0)/prev.length:null;
  const dec=m.dec||0;
  let h=`<h2 style="margin-top:16px">Trends</h2><div class="chips">${trendKeys().filter(b=>b.on).map(b=>b.id).map(k=>`<button class="chip ${k===trendK?'on':''}" data-act="tk" data-k="${k}">${MET[k].n}</button>`).join('')}</div>
   <div class="seg">${[7,30,90].map(r=>`<button class="${r===trendR?'on':''}" data-act="tr" data-r="${r}">${r} Tage</button>`).join('')}</div>
   <div class="card"><div class="ct">${m.n}<small>${m.u}</small></div>${chart(pts,m)}
   <div class="three" style="margin-top:10px;text-align:center">
    <div><div class="num" style="font-size:20px;font-weight:700">${fmtN(avg,dec)}</div><div class="sm mut">Ø</div></div>
    <div><div class="num" style="font-size:20px;font-weight:700">${vs.length?fmtN(Math.min(...vs),dec):'–'} / ${vs.length?fmtN(Math.max(...vs),dec):'–'}</div><div class="sm mut">Min / Max</div></div>
    <div><div class="num" style="font-size:20px;font-weight:700">${avg!=null&&pa!=null?(avg>=pa?'+':'')+fmtN(avg-pa,dec):'–'}</div><div class="sm mut">vs. davor</div></div></div>
   <div class="hint">${m.info}</div></div>`;
  // Logbuch-Einfluss
  const imp=journalImpact();
  h+=`<h2>Logbuch-Einfluss auf Erholung</h2><div class="card">${imp.length?imp.map(i=>`<div class="row"><span style="flex:1;padding-right:10px">${esc(i.t)}</span><b style="color:${i.diff>=0?'var(--green)':'var(--red)'}">${i.diff>=0?'+':''}${i.diff} %</b></div>`).join('')+'<div class="hint">Erholung am Folgetag mit „Ja“ vs. „Nein“ (mind. 3× je Antwort).</div>':'<div class="sm mut">Fülle das Logbuch ein paar Tage aus – dann siehst du hier, was deine Erholung beeinflusst.</div>'}</div>`;
  h+=`<button class="btn sec" data-act="sheet" data-s="report">Bericht für eine KI exportieren</button>`;
  return h}
function journalImpact(){const res=[];activeQ().forEach(q=>{const y=[],no=[];Object.entries(S.journal).forEach(([d,j])=>{const a=j.a&&j.a[q.id];if(a==null)return;const r=recOf(addD(d,1)).v;if(r==null)return;(a?y:no).push(r)});
  if(y.length>=3&&no.length>=3){const av=a=>a.reduce((s,x)=>s+x,0)/a.length;res.push({t:q.t,diff:Math.round(av(y)-av(no))})}});return res.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff))}

   <h2>Kraft-Routinen</h2><div class="card"><div class="list">${S.routines.length?S.routines.map(r=>`<div class="it" data-act="routine" data-id="${r.id}"><div class="ic">${IC.lift}</div><div class="tx"><div>${esc(r.name)}</div><div>${(r.ex||[]).length} Übungen</div></div>

   <h2>Verlauf</h2><div class="card"><div class="list">${S.wo.length?[...S.wo].sort((a,b)=>b.date.localeCompare(a.date)||(b.start||0)-(a.start||0)).slice(0,40).map(woItem).join(''):'<div class="sm mut">Noch keine Trainings.</div>'}</div></div>
   <div class="hint">Rechts steht die Belastung (0–21) jeder Einheit. Sie fließt in die Tagesbelastung, deinen Schlafbedarf der nächsten Nacht und die Erholung am Folgetag ein.</div>`;

 met({k}){const m=MET[k],pts=[];for(let i=13;i>=0;i--){const d=addD(day,-i);pts.push({d,v:m.get(d)})}const v=m.get(day);
  let extra='';

  return{t:m.n,h:`<div class="card"><div class="big">${v==null?'–':fmtN(v,m.dec||0)} <span class="mut" style="font-size:18px">${m.u}</span></div><div class="sm mut" style="margin-top:4px">${dLong(day)}</div>${extra}</div>

   QCAT.concat([...new Set(S.qCustom.map(q=>q.c))].filter(c=>!QCAT.includes(c))).map(c=>{const qs=activeQ().filter(q=>q.c===c);if(!qs.length)return'';

async function bandSync(){if(!window.Strap){toast('Bluetooth-Modul lädt noch');return}
  if(!Strap.supported()){openSheet('strap');return}
  syncMsg='';try{const r=await Strap.sync();S.band=Object.assign({},S.band,{last:Date.now()});
    const ds=new Set(r.days);r.days.forEach(d=>ds.add(addD(d,1)));const list=[...ds].filter(d=>d<=TODAY()).sort();
    await bandApply(list);if(AL().on||S.alarmSet)await armAlarm(true);syncMsg=r.samples?fmtN(r.samples)+' Messpunkte übernommen ('+list.length+' Tage).':'Keine neuen Daten auf dem Band.';toast(syncMsg)}
  catch(e){syncMsg='Fehler: '+(e&&e.message||e);toast(syncMsg)}
  save();render();if(shKind==='strap')reSheet();pushSoon();setTimeout(()=>window.__chk&&window.__chk(),4000)}
async function bandApply(list){if(!window.Strap||!list.length)return;
  const res=await Strap.analyze(list,{maxHr:maxHr(),rhrFallback:Math.round(base(TODAY(),'rhr')||60)});
  Object.entries(res).forEach(([d,r])=>{const o={src:'band',worn:r.worn,strain:r.strain,stress:r.stress};
    if(r.sleep!=null)Object.assign(o,{sleep:r.sleep,deep:r.deep,rem:r.rem,light:r.light,wake:r.wake,eff:r.eff,rhr:r.rhr,hrv:r.hrv});
    setDay(d,o);if(r.hyp)S.hyp[d]=r.hyp;if(r.curve&&r.curve.length)S.curve[d]=r.curve});
  mark('Whoop');save();render()}

  L.push('## Erklärung der Werte','- Erholung 0–100 % (grün ≥ 67, gelb 34–66, rot < 34), aus HRV, Ruhepuls und Schlaf; * = von der App geschätzt','- Belastung 0–21 (Whoop-Skala, logarithmisch), aus Puls/Training und Schritten','- Schlafleistung = geschlafen ÷ Schlafbedarf; Schlafdefizit = fehlender Schlaf der letzten 7 Nächte','- Stress 0–3 (aus Puls über Ruheniveau außerhalb von Training)','- Trainingslast (ACWR) = Ø Belastung 7 Tage ÷ Ø 28 Tage, optimal 0,8–1,3','');
  const MS=[['Schlaf (h)',d=>D(d).sleep!=null?D(d).sleep/60:null,1],['Schlafleistung (%)',d=>sleepOf(d).perf,0],['Schlafqualität (%)',d=>sleepOf(d).q,0],['Erholung (%)',d=>recOf(d).v,0],['Belastung',d=>strainOf(d).v,1],['HRV (ms)',d=>D(d).hrv,0],['Ruhe-HF (bpm)',d=>D(d).rhr,0],['Schritte',stepsOf,0],['Stress (0–3)',d=>stressOf(d).v,1],['Gewicht (kg)',d=>D(d).weight,1],['Kalorienbilanz (kcal)',d=>energyOf(d).bal,0]];
  const st=(f,arr)=>{const v=arr.map(f).filter(x=>x!=null&&!isNaN(x));return v.length?{a:v.reduce((s,x)=>s+x,0)/v.length,lo:Math.min(...v),hi:Math.max(...v),n:v.length}:null};
  L.push('## Zusammenfassung','| Wert | Ø | Min | Max | Ø Zeitraum davor |','|---|---|---|---|---|');

    if(ch){save();render()}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)stepsPull()});

/* ================= Ausblick, Schlafplaner, Gesundheits-Monitor, ACWR, Energie ================= */
const WDN=['Mo','Di','Mi','Do','Fr','Sa','So'];
const wdOf=d=>(fromIso(d).getDay()+6)%7+1; // 1=Mo … 7=So
const tMin=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||'');return m?+m[1]*60+ +m[2]:null};
const minT=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
function targetStrain(r){if(r==null)return[8,14];return r>=67?[14,18]:r>=34?[10,14]:[0,10]}
function outlook(d){const r=recOf(d).v,[a,b]=targetStrain(r),s=strainOf(d).v||0;
  const txt=r==null?'Noch keine Erholung – moderat bleiben.':r>=67?'Du bist gut erholt. Heute verträgst du eine harte Einheit.':r>=34?'Mittlere Erholung. Normales Training ist ok, Intensität dosieren.':'Niedrige Erholung. Heute lieber locker bewegen, Schlaf und Regeneration priorisieren.';
  return{r,a,b,s,txt}}
function wakeFor(d){const al=S.alarm,c=al&&al.days&&al.days[wdOf(d)];if(al&&al.on&&c&&c.on)return{t:c.t,alarm:true};return{t:S.profile.wake||'07:00',alarm:false}}
function planTonight(){const h=new Date().getHours(),wd=h<4?TODAY():addD(TODAY(),1),w=wakeFor(wd),need=needOf(wd),wm=tMin(w.t);
  const opt=[100,85,70].map(p=>({p,bed:minT(wm-need*p/100-15)}));return{wd,wake:w.t,alarm:w.alarm,need,opt}}
function healthOf(d){const keys=[['hrv','HRV','ms',-1],['rhr','Ruhe-HF','bpm',1],['resp','Atemfrequenz','/min',1],['sleep','Schlaf','min',-1],['stress','Stress','',1]];
  const out=[];keys.forEach(([k,n,u,bad])=>{const v=D(d)[k];if(v==null)return;const a=[];for(let i=1;i<=30;i++){const x=D(addD(d,-i))[k];if(x!=null)a.push(x)}
    if(a.length<7)return;const m=a.reduce((s,x)=>s+x,0)/a.length,sd=Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length)||1,z=(v-m)/sd;
    out.push({k,n,u,v,m,lo:m-2*sd,hi:m+2*sd,warn:z*bad>2,z})});return out}
function acwrOf(d){const ac=avgN(k=>strainOf(k).v,d,7),ch=avgN(k=>strainOf(k).v,d,28);if(ac==null||!ch)return{v:null};
  const v=Math.round(ac/ch*100)/100;return{v,ac,ch,zone:v<0.8?['Unterfordert','var(--s-low)']:v<=1.3?['Optimal','var(--green)']:v<=1.5?['Erhöht','var(--yellow)']:['Verletzungsrisiko','var(--red)']}}
MET.acwr={n:'Trainingslast',u:'',ic:'train',get:d=>acwrOf(d).v,dec:2,stroke:'var(--yellow)',min:0,
  info:'Verhältnis akute Last (Ø Belastung 7 Tage) zu chronischer Last (Ø 28 Tage). 0,8–1,3 ist der optimale Bereich. Über 1,5 steigt das Verletzungsrisiko deutlich, unter 0,8 baust du Form ab.'};
const kgNow=d=>{const w=latest('weight',d,120);return w?w.v:60};
function bmrOf(d){const b=latest('bmr',d,60);if(b)return b.v;const p=S.profile;if(!p.age||!p.height)return null;return Math.round(10*kgNow(d)+6.25*p.height-5*p.age+(p.sex==='w'?-161:5))}
function woKcal(w){if(w.kcal)return w.kcal;const kg=kgNow(w.date),age=S.profile.age||30;
  if(w.avg)return Math.round(Math.max(0,(S.profile.sex==='w'?(-20.4022+0.4472*w.avg-0.1263*kg+0.074*age):(-55.0969+0.6309*w.avg+0.1988*kg+0.2017*age))/4.184)*(w.dur||0));
  const met=w.kind==='kraft'?5:2+(w.rpe||5);return Math.round(met*kg*(w.dur||0)/60)}
function energyOf(d){const bmr=bmrOf(d),st=stepsOf(d)||0,kg=kgNow(d),wk=woOn(d).reduce((a,w)=>a+woKcal(w),0),steps=Math.round(st*0.0004*kg);
  const out=bmr!=null?bmr+steps+wk:null,eat=S.eat&&S.eat[d];return{bmr,steps,wk,out,eat,bal:out!=null&&eat!=null?eat-out:null}}
MET.energy={n:'Kalorienbilanz',u:'kcal',ic:'scale',get:d=>energyOf(d).bal,bar:1,stroke:'var(--yellow)',col:v=>v>0?'var(--s-high)':'var(--mint)',
  info:'Gegessene Kalorien (aus Nutrac) minus Verbrauch (Grundumsatz + Schritte + Training). Negativ = Defizit.'};
TILES.push('acwr','energy');TREND_KEYS.push('acwr','energy');
Object.assign(BLOCKS,{outlook:'Täglicher Ausblick',plan:'Schlafplaner & Wecker',health:'Gesundheits-Monitor',energy:'Kalorienbilanz (Nutrac)'});
DEF_LAYOUT.splice(DEF_LAYOUT.indexOf('rings')+1,0,'outlook');DEF_LAYOUT.splice(DEF_LAYOUT.indexOf('sleep')+1,0,'plan');DEF_LAYOUT.splice(DEF_LAYOUT.indexOf('rec')+1,0,'health');DEF_LAYOUT.splice(DEF_LAYOUT.indexOf('strain')+1,0,'energy');
const EXTRA_B={
 outlook:()=>{const o=outlook(day),pc=clamp(o.s/(o.b||21),0,1);return`<div class="card tap" data-act="met" data-k="rec"><div class="ct">Täglicher Ausblick <small>${o.r!=null?o.r+' % Erholung':''}</small></div>
  <div style="font-weight:600;line-height:1.4">${o.txt}</div>
  <div class="row" style="margin-top:8px"><span class="mut">Ziel-Belastung</span><b>${o.a}–${o.b}</b></div>
  <div class="bar"><i style="width:${pc*100}%;background:var(--strain)"></i></div><div class="sm mut" style="margin-top:6px">Bisher ${fmtN(o.s,1)} · ${o.s>=o.b?'Ziel erreicht – jetzt erholen':o.s>=o.a?'im Zielbereich':'noch '+fmtN(o.a-o.s,1)+' bis zum Ziel'}</div></div>`},
 plan:()=>{const p=planTonight(),as=S.alarmSet&&S.alarmSet.unix*1000>Date.now()?S.alarmSet:null;
  return`<div class="card tap" data-act="sheet" data-s="alarm"><div class="ct">Schlafplaner <small>Bedarf ${hm(p.need)} h</small></div>
  <div style="display:flex;justify-content:space-between;align-items:flex-end"><div><div class="big">${p.opt[0].bed}</div><div class="sm mut" style="margin-top:4px">ins Bett für 100 %</div></div>
  <div style="text-align:right"><div class="num" style="font-size:22px;font-weight:700">${p.wake}</div><div class="sm mut">${p.alarm?'Wecker':'Aufstehen'} ${WDN[wdOf(p.wd)-1]}</div></div></div>
  <div class="row" style="margin-top:8px"><span class="mut">85 % · 70 %</span><b>${p.opt[1].bed} · ${p.opt[2].bed}</b></div>
  ${BS().battery!=null&&BS().battery<20?`<div class="hint" style="color:var(--yellow)">Band-Akku ${BS().battery} % – vor dem Schlafen laden, sonst fällt der Wecker aus.</div>`:''}
  <div class="row"><span class="mut">Band-Wecker</span><b style="font-family:var(--ui);font-size:15px">${as?new Date(as.unix*1000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+(as.smart?' (smart)':''):S.alarm&&S.alarm.on?'nicht gestellt':'aus'}</b></div></div>`},
 health:()=>{const h=healthOf(day);if(!h.length)return`<div class="card"><div class="ct">Gesundheits-Monitor</div><div class="sm mut">Braucht mindestens 7 Tage Daten als Vergleich.</div></div>`;
  const w=h.filter(x=>x.warn);return`<div class="card"><div class="ct">Gesundheits-Monitor <small>${w.length?w.length+' auffällig':'alles im Rahmen'}</small></div>
  ${h.map(x=>`<div class="row"><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:${x.warn?'var(--red)':'var(--green)'}"></i>${x.n}</span><span><b>${x.k==='sleep'?hm(x.v):fmtN(x.v,x.k==='stress'||x.k==='resp'?1:0)}</b> <span class="sm mut">${x.u==='min'?'h':x.u} · normal ${x.k==='sleep'?hm(x.lo)+'–'+hm(x.hi):fmtN(x.lo,x.k==='stress'||x.k==='resp'?1:0)+'–'+fmtN(x.hi,x.k==='stress'||x.k==='resp'?1:0)}</span></span></div>`).join('')}
  ${w.length?`<div class="hint">Mehrere Werte außerhalb deines normalen Bereichs können auf Erkältung, Stress, Alkohol oder Übertraining hindeuten. Bei Beschwerden ärztlich abklären.</div>`:''}</div>`},
 energy:()=>{const e=energyOf(day);return`<div class="card tap" data-act="met" data-k="energy"><div class="ct">Kalorienbilanz <small>${S.nt?'Nutrac':'<span data-act="sheet" data-s="nutrac">Nutrac verbinden</span>'}</small></div>
  <div class="row"><span class="mut">Gegessen</span><b>${fmtN(e.eat)}</b></div>
  <div class="row"><span class="mut">Verbrauch</span><b>${fmtN(e.out)}</b></div><div class="sm dim" style="margin:-4px 0 4px">${e.bmr!=null?'Grundumsatz '+fmtN(e.bmr)+' · Schritte '+fmtN(e.steps)+' · Training '+fmtN(e.wk):'Alter & Größe im Profil eintragen'}</div>
  <div class="row"><span class="mut">Bilanz</span><b style="color:${e.bal==null?'inherit':e.bal>0?'var(--s-high)':'var(--mint)'}">${e.bal==null?'–':(e.bal>0?'+':'')+fmtN(e.bal)}</b></div></div>`}
};

/* ================= Wecker auf dem Band (mit Schlafzyklus-Logik) ================= */
const DEF_ALARM=()=>({on:false,smart:true,win:30,days:Object.fromEntries([1,2,3,4,5,6,7].map(i=>[i,{on:i<=5,t:i<=5?'06:30':'08:30'}]))});
const AL=()=>S.alarm||(S.alarm=DEF_ALARM());
function nextAlarm(){const al=AL();if(!al.on)return null;const now=new Date();
  for(let i=0;i<8;i++){const d=addD(TODAY(),i),c=al.days[wdOf(d)];if(!c||!c.on)continue;const m=tMin(c.t);if(m==null)continue;
    const dt=fromIso(d);dt.setHours(Math.floor(m/60),m%60,0,0);if(dt-now>10*6e4)return{d,dt}}return null}
function smartTime(n){const al=AL(),target=n.dt.getTime();if(!al.smart)return{t:target,smart:false};
  const need=needOf(n.d)*6e4,win=(al.win||30)*6e4,planBed=target-need-15*6e4,onset=Math.max(Date.now()+15*6e4,planBed+15*6e4),cand=[];
  for(let k=1;k<=8;k++){const c=onset+k*90*6e4;if(c>=target-win&&c<=target)cand.push(c)}
  if(!cand.length)return{t:target,smart:false,onset};
  const ok=cand.find(c=>c-onset>=need);return{t:ok||cand[cand.length-1],smart:true,onset}}
async function armAlarm(quiet){if(!window.Strap||!Strap.supported()){if(!quiet)openSheet('alarm');return}
  try{const n=nextAlarm();if(!n){await Strap.disableAlarm();S.alarmSet=null;save();if(!quiet)toast('Wecker auf dem Band ausgeschaltet');return}
    const s=smartTime(n),u=Math.floor(s.t/1000);await Strap.setAlarm(u);const bat=BS().battery;if(bat!=null&&bat<20)setTimeout(()=>toast('Achtung: Band-Akku nur '+bat+' % – laden, sonst fällt der Wecker aus'),2800);S.alarmSet={unix:u,smart:s.smart,target:Math.floor(n.dt/1000),win:AL().win};save();
    if(!quiet)toast('Band weckt '+new Date(s.t).toLocaleString('de-DE',{weekday:'short',hour:'2-digit',minute:'2-digit'})+(s.smart?' (smart)':''))}
  catch(e){if(!quiet)toast('Wecker: '+(e&&e.message||e))}
  if(shKind==='alarm')reSheet();render()}
/* ================= Live-Training mit dem Band ================= */
let LV=null;window.__busy=()=>!!(LV&&LV.run)||!!(window.Strap&&Strap.state.syncing)||(typeof shKind!=='undefined'&&['wo','routine','journal'].includes(shKind));
function liveTick(hr){if(!LV||!LV.run)return;const t=Date.now(),dt=Math.min(10,(t-LV.lt)/1000);LV.lt=t;LV.hr=hr;LV.n++;LV.sum+=hr;LV.max=Math.max(LV.max,hr);
  const r=rhrAt(TODAY()),x=clamp((hr-r)/(maxHr()-r),0,1);if(x>=0.25)LV.trimp+=dt/60*x*0.64*Math.exp(1.92*x);
  const z=zoneOf(hr);LV.zones[z]=(LV.zones[z]||0)+dt}
const zoneOf=hr=>{const p=hr/maxHr();return p<0.5?0:p<0.6?1:p<0.7?2:p<0.8?3:p<0.9?4:5};
const ZCOL=['var(--dim)','#7ba1bb','var(--mint)','var(--yellow)','#f5a33a','var(--red)'];

/* ================= Erinnerungen (Push wie bei Nutrac, über Supabase) ================= */
const pushOk=()=>'serviceWorker'in navigator&&'PushManager'in window&&'Notification'in window;
const DEF_REM=()=>[{t:'08:00',title:'Guten Morgen',body:'Band synchronisieren und Logbuch für gestern ausfüllen.',url:'./#heute',on:true,days:[]}];
const REM=()=>S.rem||(S.rem=DEF_REM());
const b64u=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const sbPost=(path,body)=>fetch(SB_URL+path,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},body:JSON.stringify(body)});
function pushIds(){if(!S.pushId){S.pushId=crypto.randomUUID();S.pushTok=b64u(crypto.getRandomValues(new Uint8Array(32)));save()}return{id:S.pushId,token:S.pushTok}}
function batPred(){const l=(S.batLog||[]).filter(x=>Date.now()-x[0]<36*36e5);if(!l.length)return null;const last=l[l.length-1];let rate=0.85/36e5;
  const prev=l.filter(x=>last[0]-x[0]>2*36e5&&x[1]>last[1]);if(prev.length){const f=prev[0],r=(f[1]-last[1])/(last[0]-f[0]);if(r>0.2/36e5&&r<4/36e5)rate=r}
  return{pct:last[1],t:last[0],at:last[1]>15?last[0]+(last[1]-15)/rate:last[0],at5:last[1]>5?last[0]+(last[1]-5)/rate:last[0]}}
function pushCfg(){if(!S.push)return null;const rem=REM().slice(),bp=batPred();
  if(S.bedRem!==false){const p=planTonight();rem.push({t:minT(tMin(p.opt[0].bed)-30),title:'Bald ins Bett',body:`Für 100 % Schlaf um ${p.opt[0].bed} ins Bett (${p.alarm?'Wecker':'aufstehen'} ${p.wake}).${p.alarm?' Vorher kurz in Bluefy syncen – dann wird der Smart-Wecker genauer.':''}`,url:'./#heute',on:true,days:[]})}
  return Object.assign({},S.push,{rem,bat:bp&&S.batRem!==false?{at:Math.round(bp.at),at5:Math.round(bp.at5)}:null})}
let pushT=null;async function pushSync(){const c=pushCfg();if(!c)return;const js=JSON.stringify(c);if(js===S.pushSynced)return;
  try{const{id,token}=pushIds();const r=await sbPost('/rest/v1/rpc/whoop_save',{p_id:id,p_token:token,p_cfg:c,p_tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Berlin'});if(r.ok&&(await r.json())===true){S.pushSynced=js;savePlain()}}catch(e){}}
const pushSoon=()=>{clearTimeout(pushT);pushT=setTimeout(pushSync,800)};
async function pushOn(){try{const perm=await Notification.requestPermission();if(perm!=='granted'){toast('Mitteilungen nicht erlaubt');return}
  const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;const old=await reg.pushManager.getSubscription();if(old)await old.unsubscribe();
  const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign']),jwk=await crypto.subtle.exportKey('jwk',kp.privateKey),raw=await crypto.subtle.exportKey('raw',kp.publicKey);
  const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:new Uint8Array(raw)});
  S.push={sub:sub.toJSON(),pub:b64u(raw),priv:jwk.d};S.pushSynced=null;save();await pushSync();toast(S.pushSynced?'Erinnerungen sind an':'Erlaubt, aber Speichern ging nicht');reSheet()}
  catch(e){toast('Ging nicht: '+(e&&e.message||e))}}
async function pushOff(){try{const reg=await navigator.serviceWorker.getRegistration(),sub=reg&&await reg.pushManager.getSubscription();if(sub)await sub.unsubscribe()}catch(e){}
  if(S.pushId)sbPost('/rest/v1/rpc/whoop_delete',{p_id:S.pushId,p_token:S.pushTok}).catch(()=>{});S.push=null;S.pushSynced=null;save();reSheet();toast('Erinnerungen aus')}

/* ================= Nutrac (gegessene Kalorien) ================= */
async function ntAuth(body,grant){const r=await fetch(SB_URL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.access_token)throw new Error(j.error_description||j.msg||'Anmeldung fehlgeschlagen');S.nt={uid:j.user.id,email:j.user.email,at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-6e4};savePlain()}
async function ntPull(){if(!S.nt)return;try{if(Date.now()>S.nt.exp)await ntAuth({refresh_token:S.nt.rt},'refresh_token');
  const r=await fetch(`${SB_URL}/rest/v1/docs?select=date,data&user_id=eq.${S.nt.uid}&col=eq.food&date=gte.${addD(TODAY(),-45)}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+S.nt.at},cache:'no-store'});if(!r.ok)return;
  const eat={};(await r.json()).forEach(x=>{const d=x.data||{};if(d.kind&&d.kind!=='food')return;const k=+d.kcal||0;if(x.date&&k)eat[x.date]=(eat[x.date]||0)+k});
  const js=JSON.stringify(eat);if(js!==JSON.stringify(S.eat||{})){S.eat=eat;save();render()}}catch(e){}}

/* ================= Geräte-Sync (Bluefy ↔ Homescreen-App) ================= */
const NOSYNC=['pushSynced','sync','syncTs','setup','nt','lsPartial'];
let syT=null,syBusy=false;
function syncPayload(){const o={};for(const k in S){if(!NOSYNC.includes(k))o[k]=S[k]}return o}
async function syncPush(){if(!S.sync||!S.sync.on||syBusy)return;syBusy=true;try{const ts=S.mod||Date.now();
  const r=await sbPost('/rest/v1/rpc/pulse_save',{p_id:S.sync.id,p_token:S.sync.token,p_data:syncPayload(),p_ts:ts});if(r.ok&&(await r.json())===true){S.syncTs=ts;S.sync.last=Date.now();savePlain()}}catch(e){}syBusy=false}
async function syncPull(){if(!S.sync||!S.sync.on)return;try{const r=await sbPost('/rest/v1/rpc/pulse_load',{p_id:S.sync.id,p_token:S.sync.token,p_since:S.syncTs||0});if(!r.ok)return;const j=await r.json();
  if(j.error){toast('Sync-Code ungültig');return}if(j.none){syncPush();return}if(j.same){if((S.mod||0)>(S.syncTs||0))syncPush();return}
  mergeRemote(j.data,j.ts>(S.mod||0));S.syncTs=j.ts;S.sync.last=Date.now();savePlain();render();if((S.mod||0)>j.ts)syncPush()}catch(e){}}
function mergeRemote(R,newer){if(!R)return;
  for(const d in R.days||{})S.days[d]=newer?Object.assign({},S.days[d],R.days[d]):Object.assign({},R.days[d],S.days[d]);
  ['hyp','curve'].forEach(k=>{for(const d in R[k]||{})if(newer||!S[k][d])S[k][d]=R[k][d]});
  const del=new Set([...(S.del||[]),...(R.del||[])]);S.del=[...del].slice(-500);
  ['wo','routines'].forEach(k=>{const m=new Map((S[k]||[]).map(x=>[x.id,x]));(R[k]||[]).forEach(x=>{if(!m.has(x.id)||newer)m.set(x.id,x)});S[k]=[...m.values()].filter(x=>!del.has(x.id))});
  for(const d in R.journal||{}){const a=S.journal[d],b=R.journal[d];if(!a||(b.at||0)>(a.at||0))S.journal[d]=b}
  if(newer)['profile','ai','layout','trendL','qHide','qCustom','alarm','rem','bedRem','fitExt','band','src','eat','alarmSet','healthSync','push','pushId','pushTok','batLog'].forEach(k=>{if(R[k]!==undefined)S[k]=R[k]})}
const syncSoon=()=>{clearTimeout(syT);syT=setTimeout(syncPush,2500)};

/* ================= Start ================= */
(function(){const q=new URLSearchParams(location.search),st=q.get('steps');if(st!=null&&n(st)!=null){setDay(TODAY(),{steps:Math.round(n(st))});mark('Kurzbefehl');save();q.delete('steps');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash);setTimeout(()=>toast('Schritte übernommen: '+fmtN(n(st))),300)}})();
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(TABS.some(x=>x[0]===t)&&t!==tab){tab=t;render()}});
(async function boot(){try{const js=await idbGet('S');if(js){const o=JSON.parse(js);if(!S.mod||(o.mod||0)>=(S.mod||0)||S.lsPartial){S=Object.assign(DEF(),o);S.profile=Object.assign(DEF().profile,o.profile)}}}catch(e){}
  delete S.chat;delete S.ai;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if(hasData()&&!S.sync){S.sync={id:crypto.randomUUID(),token:b64u(crypto.getRandomValues(new Uint8Array(32))),on:true,auto:1};S.syncTs=0}
  savePlain();render();stepsPull();syncPull();ntPull();pushSoon();
  if(!S.setup&&!S.profile.name)setTimeout(()=>openSheet('profile'),400)})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncPull();ntPull();pushSoon()}});
