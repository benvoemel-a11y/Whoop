name: Erinnerungen
# Bene
on:
  schedule:
    # Alle 15 Minuten; das Skript prüft selbst, welche Erinnerung in Berlin gerade fällig ist.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = sofort eine Test-Benachrichtigung schicken'
        default: 'test'

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save web-push@3.6.7
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: sent-${{ github.run_id }}
          restore-keys: sent-
      - run: node tools/push_senden.js
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: sent-${{ github.run_id }}
